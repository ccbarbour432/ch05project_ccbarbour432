       <section>
        <h2>Contact Form</h2>

        <span class="form_errors"></span>

        <form onsubmit="return validate_form(this);" novalidate>
            
                <fieldset>
                    <legend>Please Provide Your Email Address</legend>
                    <input type="email" id="email" name="email" placeholder="Email Address" required onblur="checkLength(this, 'Confirm Email', 8)">
                </fieldset>
            <br/>
                <fieldset>
                    <legend>Please Type Your Name</legend>
                    <input type="text" id="name" name="name" placeholder="Name" required >
                </fieldset>
            <br/>
                <fieldset>
                    <legend>Select One</legend>
                    <select id="select" name="Select One" required >
                        <option value=""></option>
                        <option value="this">This</option>
                        <option value="that">That</option>
                        <option value="other">Other</option>
                    </select>
                </fieldset>
            
                <span class="form_errors"></span>
                <form onsubmit = "return(validate_form(this));">
                <br/>
            <input type="submit" value="Submit">    
        <br/>
            <span>Required fields are highlighted in Yellow.</span>
        <br/>
                
        </form>
        <span id="missing-count"></span>
        <br/>
    
       </section>
