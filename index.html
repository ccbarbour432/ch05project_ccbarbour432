<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Developer: Calen Barbour
         Date: 09-05-2026 -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home</title>

    <link rel="stylesheet" type="text/css" href="./styles/main.css">
    <script src="./scripts/form-validation.js" defer></script>
</head>

<body>

    <header>
        <h1>Home</h1>

        <nav>
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>
                <li>
                    <a href="#">About</a>
                </li>
                <li>
                    <a href="contact.html">Contact</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Contact Form</h2>

            <form id="contact-form">

                <fieldset>
                    <legend>Email Address (for the King of Nigeria)</legend>

                    <label for="email">Not Spam:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Email Address"
                        class="required"
                    >
                </fieldset>

                <br/>

                <fieldset>
                    <legend>WHAT...is your name?</legend>

                    <label for="name">Name:</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Name"
                        class="required"
                    >
                </fieldset>

                <br/>

                <fieldset>
                    <legend>WHAT...is the capital of Assyria?</legend>

                    <label for="select">Choose an option:</label>
                    <select
                        id="select"
                        name="select"
                        class="required"
                    >
                        <option value="">-- Select One --</option>
                        <option value="what">What?</option>
                        <option value="uhh">Uhh...</option>
                        <option value="idk">I Don't Know That!</option>
                    </select>
                </fieldset>

                <br/>

                <input type="button" id="submit-button" value="Submit">

                <br/>

                <span id="missing-count"></span>

                <br/>

                <span>Required fields are highlighted in yellow.</span>

            </form>
        </section>
    </main>

</body>
</html>
